app-id: me.proton.Mail
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: *runtime-version
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: start-proton-mail
finish-args:
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  # DBus-based libsecret
  - --talk-name=org.freedesktop.secrets
  - --env=XCURSOR_PATH=~/.icons:/app/share/icons:/icons:/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: proton-mail
    buildsystem: simple
    build-options:
      prepend-path: /usr/lib/sdk/node24/bin:/run/build/proton-mail/.bin:/run/build/proton-mail/node_modules/.bin
      env:
        HOME: /run/build/proton-mail
        CI: 'true'
        SENTRY_CLI_SKIP_DOWNLOAD: '1'
        XDG_CACHE_HOME: /run/build/proton-mail/flatpak-node/cache
        FLATPAK_ELECTRON_ZIP_DIR: /run/build/proton-mail/flatpak-node/cache/electron
        npm_config_nodedir: /usr/lib/sdk/node24
        SWC_NATIVE_BINDING_CACHE: /tmp/swc
        NODE_ENV: production
        RELEASE: production
    build-commands:
      - rm -f .npmrc
      - install -Dm755 pnpm-exe/pnpm .bin/pnpm
      - |
        python3 -c "
        import pathlib, re
        text = pathlib.Path('pnpm-workspace.yaml').read_text()
        text = re.sub(r'minimumReleaseAge:\s*\d+\s*\n', '', text)
        text = re.sub(r'minimumReleaseAgeExclude:\s*\n(?:\s*-\s*.*\n)*', '', text)
        text += '\ntrustLockfile: true\n'
        pathlib.Path('pnpm-workspace.yaml').write_text(text)
        "
      - pnpm --filter proton-inbox-desktop... install --offline --frozen-lockfile --trust-lockfile --ignore-scripts


      - cd applications/inbox-desktop && pnpm exec electron-forge package

      - |
        case "$FLATPAK_ARCH" in
          aarch64) ELECTRON_ARCH=arm64 ;;
          *)       ELECTRON_ARCH=x64 ;;
        esac
        cp -r "applications/inbox-desktop/out/Proton Mail-linux-${ELECTRON_ARCH}" "${FLATPAK_DEST}/proton-mail"

      # To allow separate locales
      # https://searchfox.org/mozilla-central/rev/8a4f55bc09ffc5c25dcb4586c51ae4a9fee77b4c/taskcluster/docker/firefox-flatpak/runme.sh#131-133
      - |
        for lang in ${FLATPAK_DEST}/proton-mail/locales/*.pak
        do
          locale="$(basename -s .pak $lang)"
          install -Dm644 -t "${FLATPAK_DEST}/share/runtime/locale/${locale%%-*}/" "$lang"
          ln -sf "${FLATPAK_DEST}/share/runtime/locale/${locale%%-*}/$(basename $lang)" "${FLATPAK_DEST}/proton-mail/locales/$(basename $lang)"
        done

      - install -Dm644 applications/inbox-desktop/assets/linux/icon.svg "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg"
      - install -Dm644 me.proton.Mail.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - patch-electron-desktop-filename "${FLATPAK_DEST}/proton-mail/resources/app.asar"
      - install -Dm644 me.proton.Mail.metainfo.xml "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - install -Dm644 LICENSE "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE"
      - install -Dm755 start-proton-mail.sh "${FLATPAK_DEST}/bin/start-proton-mail"
    sources:
      - type: git
        url: https://github.com/ProtonMail/WebClients.git
        tag: proton-inbox-desktop@1.16.1
        commit: a2e93b9af665f9dcef254d2f182dfd732f592325
        x-checker-data:
          type: json
          url: https://proton.me/download/mail/linux/version.json
          is-main-source: true
          version-query: .Releases | map(select(.CategoryName == "Stable")) | .[0].Version
          timestamp-query: .Releases | map(select(.CategoryName == "Stable")) | .[0].ReleaseDate
          tag-query: '"proton-inbox-desktop@" + (.Releases | map(select(.CategoryName
            == "Stable")) | .[0].Version)'

      - type: archive
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.13.0.tgz
        sha512: b781185051b848f61a2495504e85883eafe52c1aae08f0b132db7dbd5fff1e2ad20e5df7d9d9f10e7c20bdd5b6f6ca8b83739bdb1ef3150ebd1d92f2a02c9fa5
        dest: pnpm-exe
        only-arches: [x86_64]

      - type: archive
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.13.0.tgz
        sha512: 8e9dbd89af9f4cd861797cede05454c390b0156f5c68f34474b46ecbbfc395bbf7b23fa21e575f2577c2a2390f13883bd4d3d5c0ca58e44a1cee791f59ec6aac
        dest: pnpm-exe
        only-arches: [aarch64]

      - generated-sources.json

      - type: patch
        path: electron-zip-dir.patch

      - type: file
        path: me.proton.Mail.desktop

      - type: file
        path: me.proton.Mail.metainfo.xml

      - type: script
        dest-filename: start-proton-mail.sh
        commands:
          - exec env TMPDIR="$XDG_RUNTIME_DIR/app/${FLATPAK_ID:-me.proton.Mail}" zypak-wrapper
            "/app/proton-mail/Proton Mail" "$@"
